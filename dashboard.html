<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.0.26.04.2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root{--bg-main:#0f172a;--bg-card:rgba(17,24,39,.88);--bg-column:rgba(15,23,42,.72);--border-color:#334155;--text-main:#e5e7eb;--text-muted:#94a3b8;--primary:#38bdf8}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    body{margin:0;background:radial-gradient(circle at top,#1e293b 0,#0f172a 45%,#020617 100%);color:var(--text-main);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .page-wrapper{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden;padding:22px 18px 48px;position:relative}
    .top-header{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:18px;min-height:46px}
    .top-actions{display:flex;align-items:center;gap:10px}
    .btn-icon-create{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:0;font-size:1rem;background:linear-gradient(135deg,#0ea5e9,#38bdf8);border:0;color:#020617;font-weight:800;box-shadow:0 12px 28px rgba(56,189,248,.22)}
    .btn-icon-create:hover,.btn-icon-create:focus{background:linear-gradient(135deg,#38bdf8,#7dd3fc);color:#020617;transform:translateY(-1px)}
    .mini-profile-btn{height:46px;display:inline-flex;align-items:center;gap:10px;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.22);color:#e5e7eb;border-radius:14px;padding:0 12px 0 8px;font-size:.82rem;font-weight:800;letter-spacing:.02em}
    .mini-profile-btn:hover,.mini-profile-btn:focus{background:rgba(30,41,59,.95);border-color:rgba(203,213,225,.36);color:#f8fafc}
    .mini-profile-avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.28);color:#7dd3fc;flex:0 0 auto}
    .mini-profile-name{white-space:nowrap}
    .mini-profile-menu{background:rgba(15,23,42,.98);border:1px solid rgba(148,163,184,.18);border-radius:14px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.42)}
    .mini-profile-menu .dropdown-item{border-radius:10px;font-size:.88rem;padding:9px 11px}
    .form-label{color:#e2e8f0;font-size:.9rem}
    .form-control,.form-select{background-color:#020617;border:1px solid var(--border-color);color:var(--text-main);border-radius:12px}
    .form-control:focus,.form-select:focus{background-color:#020617;color:var(--text-main);border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(56,189,248,.14)}
    .form-control::placeholder{color:#64748b}.form-select option{background:#020617;color:var(--text-main)}
    .board-shell{flex:1 1 auto;min-height:0;overflow:hidden}
    .kanban-scroll-area{width:100%;height:100%;overflow:auto;padding:4px 6px 14px 2px;scroll-behavior:smooth}
    .kanban-scroll-area::-webkit-scrollbar{width:10px;height:10px}.kanban-scroll-area::-webkit-scrollbar-track{background:rgba(15,23,42,.68);border-radius:999px}.kanban-scroll-area::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:999px}.kanban-scroll-area::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.55)}
    .kanban-board{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:16px;min-width:max-content;width:max-content;min-height:100%;padding-right:8px}
    .kanban-column{background:var(--bg-column);border:1px solid rgba(148,163,184,.16);border-radius:22px;padding:14px;width:320px;min-width:320px;flex:0 0 320px;min-height:420px;position:relative;transition:border-color .2s ease,background .2s ease}
    .kanban-column:hover{border-color:rgba(148,163,184,.26)}.kanban-column.drag-over{border-color:rgba(56,189,248,.5);background:rgba(15,23,42,.92)}
    .kanban-column-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 12px;margin-bottom:14px;border-bottom:1px solid rgba(148,163,184,.12)}
    .kanban-column-header h2{font-size:1rem;font-weight:800;margin:0;color:#f8fafc;cursor:text;border-radius:8px;padding:4px 6px;margin-left:-6px;min-width:40px;transition:background .18s ease,outline .18s ease}
    .kanban-column-header h2:hover{background:rgba(56,189,248,.08);outline:1px dashed rgba(56,189,248,.28)}
    .kanban-column-header h2:focus{background:#020617;outline:1px solid var(--primary);box-shadow:0 0 0 .18rem rgba(56,189,248,.12)}
    .kanban-column-header strong{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.24);border-radius:999px;padding:4px 10px;font-size:.82rem}
    .column-cards{display:flex;flex-direction:column;gap:14px;min-height:300px}
    .ticket-card{background:var(--bg-card);border:1px solid rgba(148,163,184,.18);box-shadow:0 18px 40px rgba(0,0,0,.22);backdrop-filter:blur(12px);padding:16px;border-radius:18px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;cursor:pointer;user-select:none}
    .ticket-card:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.32);box-shadow:0 18px 36px rgba(0,0,0,.28)}
    .ticket-card.dragging{opacity:.5;transform:rotate(1deg)}
    .ticket-title{font-size:1rem;font-weight:800;margin:0 0 10px;color:#f8fafc}.ticket-description{color:var(--text-muted);font-size:.86rem;line-height:1.45;margin-bottom:0}
    .ticket-mini-info{display:none}
    .app-version{position:fixed;left:16px;bottom:12px;z-index:40;font-size:.82rem;color:rgba(148,163,184,.88);background:rgba(15,23,42,.86);border:1px solid rgba(148,163,184,.16);border-radius:999px;padding:6px 12px;line-height:1;backdrop-filter:blur(10px);pointer-events:none}
    .context-menu{position:fixed;z-index:3000;min-width:220px;background:rgba(15,23,42,.98);border:1px solid rgba(148,163,184,.18);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.4);padding:8px;display:none}
    .context-menu.show{display:block}.context-menu-title{padding:6px 10px 8px;font-size:.72rem;color:var(--text-muted);border-bottom:1px solid rgba(148,163,184,.1);margin-bottom:6px}
    .context-menu-item{width:100%;border:0;background:transparent;color:var(--text-main);text-align:left;padding:10px 12px;border-radius:10px;font-size:.88rem;display:flex;align-items:center;gap:10px;cursor:pointer}
    .context-menu-item:hover{background:rgba(30,41,59,.9)}.context-menu-item i{color:#7dd3fc}.context-menu-danger{color:#fecaca}.context-menu-danger:hover{background:rgba(127,29,29,.35)}.context-menu-danger i{color:#fca5a5}
    .app-toast-container{position:fixed;top:18px;right:18px;z-index:5000;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 36px));pointer-events:none}
    .app-toast{background:rgba(15,23,42,.96);border:1px solid rgba(148,163,184,.22);color:var(--text-main);border-radius:16px;padding:13px 14px;box-shadow:0 22px 55px rgba(0,0,0,.45);display:flex;align-items:flex-start;gap:10px;animation:toastIn .18s ease-out;pointer-events:auto}
    .app-toast-icon{width:28px;height:28px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:rgba(56,189,248,.13);color:#7dd3fc;border:1px solid rgba(56,189,248,.25)}
    .app-toast.error .app-toast-icon{background:rgba(239,68,68,.13);color:#fca5a5;border-color:rgba(248,113,113,.35)}.app-toast.success .app-toast-icon{background:rgba(34,197,94,.13);color:#86efac;border-color:rgba(74,222,128,.35)}
    .app-toast-title{font-weight:800;font-size:.9rem;margin-bottom:2px}.app-toast-message{color:var(--text-muted);font-size:.82rem;line-height:1.35}.app-toast.hide{opacity:0;transform:translateY(-8px) scale(.98);transition:.18s ease}
    @keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-content{background:#0f172a;color:var(--text-main);border:1px solid rgba(148,163,184,.2);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}.modal-header,.modal-footer{border-color:rgba(148,163,184,.16)}.btn-close{filter:invert(1) grayscale(100%)}
    .meta-box{background:rgba(15,23,42,.74);border:1px solid rgba(148,163,184,.12);border-radius:14px;padding:10px}.meta-label{display:block;font-size:.72rem;color:var(--text-muted);margin-bottom:3px}.meta-value{font-size:.88rem;font-weight:700;color:#e2e8f0}
    .log-list{display:flex;flex-direction:column;gap:12px}.log-item{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.14);border-radius:14px;padding:12px 14px}.log-date{font-size:.76rem;color:var(--text-muted);margin-bottom:4px}.log-text{font-size:.92rem;color:#e2e8f0;line-height:1.4}
    .editable-title,.editable-description{cursor:text;border-radius:10px;padding:4px 6px;margin-left:-6px;transition:background .18s ease,outline .18s ease}.editable-title:hover,.editable-description:hover{background:rgba(56,189,248,.08);outline:1px dashed rgba(56,189,248,.28)}
    .edit-inline-input,.edit-inline-textarea{width:100%;background:#020617;border:1px solid var(--primary);color:var(--text-main);border-radius:12px;outline:none;box-shadow:0 0 0 .18rem rgba(56,189,248,.12)}
    .edit-inline-input{font-size:1.5rem;font-weight:800;padding:8px 10px;margin-bottom:12px}.edit-inline-textarea{font-size:.95rem;line-height:1.5;padding:10px 12px;min-height:100px;resize:vertical;margin-bottom:16px}
    @media(max-width:768px){.page-wrapper{padding:18px 12px 48px}.top-actions{width:100%;justify-content:flex-end}.kanban-column{width:300px;min-width:300px;flex-basis:300px}}
  </style>
</head>
<body>
  <div class="app-toast-container" id="appToastContainer"></div>
  <main class="page-wrapper">
    <section class="top-header">
      <div class="top-actions">
        <div class="mini-profile dropdown">
          <button class="mini-profile-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Usuário logado">
            <span class="mini-profile-avatar"><i class="bi bi-person-fill"></i></span>
            <span class="mini-profile-name">USUÁRIO LOGADO</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end mini-profile-menu">
            <li><button class="dropdown-item text-danger" type="button" id="logoutButton"><i class="bi bi-box-arrow-right me-2"></i>Sair da conta</button></li>
          </ul>
        </div>
        <button class="btn btn-icon-create" data-bs-toggle="modal" data-bs-target="#modalNovaColuna" title="Criar coluna"><i class="bi bi-plus-lg"></i></button>
      </div>
    </section>
    <div class="board-shell"><div class="kanban-scroll-area"><section class="kanban-board" id="kanbanBoard"></section></div></div>
    <div class="app-version">1.0.26.04.2026</div>
  </main>

  <div id="columnContextMenu" class="context-menu">
    <div class="context-menu-title" id="columnContextMenuTitle">Ações da coluna</div>
    <button type="button" class="context-menu-item" id="addCardFromContext"><i class="bi bi-plus-square"></i>Adicionar novo card</button>
    <button type="button" class="context-menu-item context-menu-danger" id="removeColumnFromContext"><i class="bi bi-trash"></i>Remover coluna</button>
  </div>
  <div id="cardContextMenu" class="context-menu">
    <div class="context-menu-title">Ações do card</div>
    <button type="button" class="context-menu-item context-menu-danger" id="removeCardFromContext"><i class="bi bi-trash"></i>Excluir card</button>
  </div>

  <div class="modal fade" id="modalNovaColuna" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-md modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold">Criar coluna</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
    <div class="modal-body"><form id="newColumnForm"><label class="form-label">Título da coluna</label><input type="text" class="form-control" id="newColumnTitle" placeholder="Ex: Aguardando fornecedor"/></form></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-info fw-bold" id="saveNewColumnBtn"><i class="bi bi-save me-1"></i>Salvar coluna</button></div>
  </div></div></div>

  <div class="modal fade" id="modalNovoCard" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold">Criar Card</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
    <div class="modal-body"><form class="row g-3" id="newCardForm">
      <div class="col-12"><label class="form-label">Título do card</label><input type="text" class="form-control" id="newCardTitle" placeholder="Ex: Outlook não abre"/></div>
      <div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" rows="4" id="newCardDescription" placeholder="Descreva o problema ou tarefa..."></textarea></div>
      <div class="col-12 col-md-6"><label class="form-label">Quem pediu</label><input type="text" class="form-control" id="newCardRequestedBy" placeholder="Nome da pessoa"/></div>
      <div class="col-12 col-md-6"><label class="form-label">Responsável</label><select class="form-select" id="newCardResponsible"><option value="">Sem responsável</option></select></div>
    </form></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-info fw-bold" id="saveNewCardBtn"><i class="bi bi-save me-1"></i>Salvar card</button></div>
  </div></div></div>

  <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-md modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold text-danger" id="confirmTitle">Confirmar ação</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
    <div class="modal-body"><p class="mb-0 text-secondary" id="confirmText">Tem certeza?</p></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger fw-bold" id="confirmButton">Confirmar</button></div>
  </div></div></div>

  <div class="modal fade" id="modalDetalhesCard" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title fw-bold">Detalhes do card</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
    <div class="modal-body"><div class="row g-4">
      <div class="col-12 col-lg-7"><div class="p-3 rounded-4" style="background:rgba(15,23,42,.75);border:1px solid rgba(148,163,184,.14);">
        <h4 class="fw-bold editable-title" id="detailTitleDisplay" title="Clique para editar o título"></h4>
        <input type="text" id="detailTitleInput" class="edit-inline-input d-none"/>
        <p class="text-secondary mb-4 editable-description" id="detailDescriptionDisplay" title="Clique para editar a descrição"></p>
        <textarea id="detailDescriptionInput" class="edit-inline-textarea d-none"></textarea>
        <div class="row g-3">
          <div class="col-12 col-md-6"><div class="meta-box"><span class="meta-label">Quem pediu</span><span class="meta-value" id="detailRequestedBy"></span></div></div>
          <div class="col-12 col-md-6"><div class="meta-box"><span class="meta-label">Responsável</span><span class="meta-value" id="detailResponsible"></span></div></div>
          <div class="col-12 col-md-6"><div class="meta-box"><span class="meta-label">Coluna atual</span><span class="meta-value" id="detailCurrentColumn"></span></div></div>
        </div>
      </div></div>
      <div class="col-12 col-lg-5"><h6 class="fw-bold mb-3">Log de acontecimentos</h6><div class="log-list" id="cardLogList"></div></div>
    </div></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fechar</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const toastContainer=document.getElementById("appToastContainer");
    const kanbanBoard=document.getElementById("kanbanBoard");
    const columnContextMenu=document.getElementById("columnContextMenu");
    const cardContextMenu=document.getElementById("cardContextMenu");
    const columnContextMenuTitle=document.getElementById("columnContextMenuTitle");
    const addCardFromContext=document.getElementById("addCardFromContext");
    const removeColumnFromContext=document.getElementById("removeColumnFromContext");
    const removeCardFromContext=document.getElementById("removeCardFromContext");
    const modalNovoCard=bootstrap.Modal.getOrCreateInstance(document.getElementById("modalNovoCard"));
    const modalNovaColuna=bootstrap.Modal.getOrCreateInstance(document.getElementById("modalNovaColuna"));
    const modalDetalhesCard=bootstrap.Modal.getOrCreateInstance(document.getElementById("modalDetalhesCard"));
    const modalConfirmacao=bootstrap.Modal.getOrCreateInstance(document.getElementById("modalConfirmacao"));
    const newColumnForm=document.getElementById("newColumnForm");
    const newColumnTitle=document.getElementById("newColumnTitle");
    const saveNewColumnBtn=document.getElementById("saveNewColumnBtn");
    const newCardForm=document.getElementById("newCardForm");
    const newCardTitle=document.getElementById("newCardTitle");
    const newCardDescription=document.getElementById("newCardDescription");
    const newCardRequestedBy=document.getElementById("newCardRequestedBy");
    const newCardResponsible=document.getElementById("newCardResponsible");
    const saveNewCardBtn=document.getElementById("saveNewCardBtn");
    const detailTitleDisplay=document.getElementById("detailTitleDisplay");
    const detailTitleInput=document.getElementById("detailTitleInput");
    const detailDescriptionDisplay=document.getElementById("detailDescriptionDisplay");
    const detailDescriptionInput=document.getElementById("detailDescriptionInput");
    const detailRequestedBy=document.getElementById("detailRequestedBy");
    const detailResponsible=document.getElementById("detailResponsible");
    const detailCurrentColumn=document.getElementById("detailCurrentColumn");
    const cardLogList=document.getElementById("cardLogList");
    const logoutButton=document.getElementById("logoutButton");
    const confirmTitle=document.getElementById("confirmTitle");
    const confirmText=document.getElementById("confirmText");
    const confirmButton=document.getElementById("confirmButton");

    let loggedUser=null, usuarios=[], colunas=[], cards=[], activeColumn=null, activeCard=null, currentCard=null, targetColumnForNewCard=null, draggedCard=null, confirmCallback=null, isRendering=false;

    function showToast(title,message,type="info"){
      const toast=document.createElement("div");
      toast.className=`app-toast ${type}`;
      const icon=type==="error"?"bi-exclamation-triangle":type==="success"?"bi-check2-circle":"bi-info-circle";
      toast.innerHTML=`<div class="app-toast-icon"><i class="bi ${icon}"></i></div><div><div class="app-toast-title">${escapeHtml(title)}</div><div class="app-toast-message">${escapeHtml(message)}</div></div>`;
      toastContainer.appendChild(toast);
      setTimeout(()=>toast.classList.add("hide"),2600);
      setTimeout(()=>toast.remove(),2850);
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    }

    async function api(url, options={}){
      const response=await fetch(url,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});
      let data={};
      try{data=await response.json();}catch(e){}
      if(!response.ok || data.ok===false) throw new Error(data.message || "Erro na requisição.");
      return data;
    }

    function showConfirm(title,text,onConfirm){
      confirmTitle.textContent=title; confirmText.textContent=text; confirmCallback=onConfirm; modalConfirmacao.show();
    }

    confirmButton.addEventListener("click", async ()=>{
      const cb=confirmCallback; confirmCallback=null; modalConfirmacao.hide();
      if(cb) await cb();
    });

    async function requireLogin(){
      try{
        const data=await api("/api/me");
        loggedUser=data.user;
        document.querySelector(".mini-profile-name").textContent=loggedUser.nome_exibicao || loggedUser.usuario;
      }catch(e){ window.location.href="/index.html"; }
    }

    async function loadUsuarios(){
      const data=await api("/api/usuarios");
      usuarios=data.usuarios || [];
      newCardResponsible.innerHTML=`<option value="">Sem responsável</option>` + usuarios.map(u=>`<option value="${u.id}">${escapeHtml(u.nome_exibicao || u.usuario)}</option>`).join("");
    }

    async function loadBoardFromApi(){
      if(isRendering) return;
      isRendering=true;
      try{
        const [colunasData,cardsData]=await Promise.all([api("/api/colunas"), api("/api/cards")]);
        colunas=colunasData.colunas || [];
        cards=cardsData.cards || [];
        renderBoard();
      }catch(error){ showToast("Erro", error.message || "Não foi possível carregar o quadro.", "error");}
      finally{isRendering=false;}
    }

    function renderBoard(){
      kanbanBoard.innerHTML="";
      colunas.forEach(coluna=>{
        const column=createColumnElement(coluna);
        const container=column.querySelector(".column-cards");
        cards.filter(card=>card.coluna_id===coluna.id).forEach(card=>container.appendChild(createCardElement(card)));
        kanbanBoard.appendChild(column);
      });
      updateColumnCounts();
    }

    function getColumnById(id){return document.querySelector(`.kanban-column[data-column-id="${CSS.escape(id)}"]`);}
    function getCardById(id){return cards.find(c=>c.id===id);}
    function getUserName(id){const u=usuarios.find(item=>item.id===id); return u ? (u.nome_exibicao || u.usuario) : "Sem responsável";}

    function updateColumnCounts(){
      document.querySelectorAll(".kanban-column").forEach(column=>{
        const count=column.querySelectorAll(".ticket-card").length;
        const badge=column.querySelector(".kanban-column-header strong");
        if(badge) badge.textContent=count;
      });
    }

    function createColumnElement(coluna){
      const column=document.createElement("div");
      column.className="kanban-column";
      column.dataset.columnId=coluna.id;
      column.dataset.columnTitle=coluna.titulo;
      column.innerHTML=`<div class="kanban-column-header"><h2>${escapeHtml(coluna.titulo)}</h2><strong>0</strong></div><div class="column-cards"></div>`;
      attachColumnEvents(column);
      return column;
    }

    function createCardElement(cardData){
      const card=document.createElement("article");
      card.className="ticket-card ticket-open-modal";
      card.setAttribute("draggable","true");
      card.dataset.cardId=cardData.id;
      const resp=cardData.responsavel?.nome_exibicao || cardData.responsavel?.usuario || "Sem responsável";
      card.innerHTML=`<h3 class="ticket-title">${escapeHtml(cardData.titulo)}</h3><p class="ticket-description">${escapeHtml(cardData.descricao)}</p><div class="ticket-mini-info"><span><i class="bi bi-person"></i> Quem pediu: ${escapeHtml(cardData.quem_pediu)}</span><span><i class="bi bi-person-check"></i> Responsável: ${escapeHtml(resp)}</span></div>`;
      attachCardEvents(card);
      return card;
    }

    function attachColumnEvents(column){
      const titleEl=column.querySelector(".kanban-column-header h2");
      titleEl.addEventListener("click",(e)=>{
        e.stopPropagation();
        titleEl.setAttribute("contenteditable","true");
        titleEl.dataset.originalTitle=column.dataset.columnTitle;
        titleEl.focus();
        const range=document.createRange(); range.selectNodeContents(titleEl);
        const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
      });
      titleEl.addEventListener("keydown",e=>{
        if(e.key==="Enter"){e.preventDefault(); titleEl.blur();}
        if(e.key==="Escape"){e.preventDefault(); titleEl.textContent=titleEl.dataset.originalTitle||column.dataset.columnTitle; titleEl.blur();}
      });
      titleEl.addEventListener("blur",async()=>{
        const oldTitle=column.dataset.columnTitle;
        const newTitle=titleEl.textContent.trim();
        titleEl.removeAttribute("contenteditable");
        if(!newTitle){titleEl.textContent=oldTitle; showToast("Campo obrigatório","O título da coluna não pode ficar vazio.","error"); return;}
        if(newTitle===oldTitle){titleEl.textContent=oldTitle; return;}
        try{
          await api("/api/colunas",{method:"PATCH",body:JSON.stringify({id:column.dataset.columnId,titulo:newTitle})});
          column.dataset.columnTitle=newTitle;
          showToast("Coluna renomeada",`A coluna "${oldTitle}" agora se chama "${newTitle}".`,"success");
          await loadBoardFromApi();
        }catch(error){titleEl.textContent=oldTitle; showToast("Erro",error.message,"error");}
      });
      column.addEventListener("contextmenu",e=>{
        if(e.target.closest(".ticket-card")) return;
        e.preventDefault(); activeColumn=column; activeCard=null;
        columnContextMenuTitle.textContent=`Ações da coluna: ${column.dataset.columnTitle}`;
        positionMenu(columnContextMenu,e.clientX,e.clientY);
      });
      column.addEventListener("dragover",e=>{e.preventDefault(); column.classList.add("drag-over");});
      column.addEventListener("dragleave",()=>column.classList.remove("drag-over"));
      column.addEventListener("drop",async e=>{
        e.preventDefault(); column.classList.remove("drag-over");
        if(!draggedCard) return;
        const cardId=draggedCard.dataset.cardId;
        const oldColumn=draggedCard.closest(".kanban-column");
        if(oldColumn?.dataset.columnId===column.dataset.columnId) return;
        column.querySelector(".column-cards").appendChild(draggedCard);
        updateColumnCounts();
        try{
          await api("/api/cards",{method:"PATCH",body:JSON.stringify({id:cardId,coluna_id:column.dataset.columnId})});
          showToast("Card movido",`Movido para ${column.dataset.columnTitle}.`,"success");
          await loadBoardFromApi();
        }catch(error){showToast("Erro",error.message,"error"); await loadBoardFromApi();}
      });
    }

    function attachCardEvents(card){
      card.addEventListener("click",()=>openCardDetails(card.dataset.cardId));
      card.addEventListener("contextmenu",e=>{e.preventDefault(); e.stopPropagation(); activeCard=card; activeColumn=null; positionMenu(cardContextMenu,e.clientX,e.clientY);});
      card.addEventListener("dragstart",()=>{draggedCard=card; card.classList.add("dragging");});
      card.addEventListener("dragend",()=>{card.classList.remove("dragging"); draggedCard=null; document.querySelectorAll(".kanban-column").forEach(c=>c.classList.remove("drag-over"));});
    }

    function hideContextMenu(){columnContextMenu.classList.remove("show"); cardContextMenu.classList.remove("show");}
    function positionMenu(menu,x,y){
      hideContextMenu(); menu.classList.add("show");
      const rect={w:menu.offsetWidth,h:menu.offsetHeight}; let left=x,top=y;
      if(left+rect.w>window.innerWidth-10) left=window.innerWidth-rect.w-10;
      if(top+rect.h>window.innerHeight-10) top=window.innerHeight-rect.h-10;
      menu.style.left=`${left}px`; menu.style.top=`${top}px`;
    }

    async function openCardDetails(cardId){
      currentCard=getCardById(cardId);
      if(!currentCard) return;
      detailTitleDisplay.textContent=currentCard.titulo;
      detailTitleInput.value=currentCard.titulo;
      detailDescriptionDisplay.textContent=currentCard.descricao;
      detailDescriptionInput.value=currentCard.descricao;
      detailRequestedBy.textContent=currentCard.quem_pediu;
      detailResponsible.textContent=currentCard.responsavel?.nome_exibicao || currentCard.responsavel?.usuario || "Sem responsável";
      detailCurrentColumn.textContent=currentCard.coluna?.titulo || "";
      closeTitleEditor(false); closeDescriptionEditor(false);
      await loadLogs(cardId);
      modalDetalhesCard.show();
    }

    async function loadLogs(cardId){
      cardLogList.innerHTML="";
      try{
        const data=await api(`/api/logs?card_id=${encodeURIComponent(cardId)}`);
        (data.logs||[]).forEach(log=>{
          const item=document.createElement("div");
          item.className="log-item";
          const d=new Date(log.criado_em);
          const dateText=isNaN(d) ? log.criado_em : d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
          item.innerHTML=`<div class="log-date">${escapeHtml(dateText)}</div><div class="log-text">${escapeHtml(log.acao)}</div>`;
          cardLogList.appendChild(item);
        });
      }catch(error){ cardLogList.innerHTML=`<div class="log-item"><div class="log-text">Não foi possível carregar o log.</div></div>`; }
    }

    function openTitleEditor(){if(!currentCard)return;detailTitleInput.value=detailTitleDisplay.textContent.trim();detailTitleDisplay.classList.add("d-none");detailTitleInput.classList.remove("d-none");detailTitleInput.focus();detailTitleInput.select();}
    async function closeTitleEditor(save=true){
      if(save&&currentCard){
        const newTitle=detailTitleInput.value.trim()||"Sem título";
        if(newTitle!==currentCard.titulo){
          try{await api("/api/cards",{method:"PATCH",body:JSON.stringify({id:currentCard.id,titulo:newTitle})}); currentCard.titulo=newTitle; showToast("Card atualizado","Título atualizado.","success"); await loadBoardFromApi();}
          catch(error){showToast("Erro",error.message,"error");}
        }
        detailTitleDisplay.textContent=currentCard.titulo;
      }
      detailTitleInput.classList.add("d-none"); detailTitleDisplay.classList.remove("d-none");
    }
    function openDescriptionEditor(){if(!currentCard)return;detailDescriptionInput.value=detailDescriptionDisplay.textContent.trim();detailDescriptionDisplay.classList.add("d-none");detailDescriptionInput.classList.remove("d-none");detailDescriptionInput.focus();}
    async function closeDescriptionEditor(save=true){
      if(save&&currentCard){
        const newDescription=detailDescriptionInput.value.trim()||"Sem descrição.";
        if(newDescription!==currentCard.descricao){
          try{await api("/api/cards",{method:"PATCH",body:JSON.stringify({id:currentCard.id,descricao:newDescription})}); currentCard.descricao=newDescription; showToast("Card atualizado","Descrição atualizada.","success"); await loadBoardFromApi();}
          catch(error){showToast("Erro",error.message,"error");}
        }
        detailDescriptionDisplay.textContent=currentCard.descricao;
      }
      detailDescriptionInput.classList.add("d-none"); detailDescriptionDisplay.classList.remove("d-none");
    }

    addCardFromContext.addEventListener("click",()=>{
      targetColumnForNewCard=activeColumn; hideContextMenu(); newCardForm.reset(); newCardResponsible.value=""; modalNovoCard.show();
    });

    removeColumnFromContext.addEventListener("click",()=>{
      if(!activeColumn)return;
      const id=activeColumn.dataset.columnId, title=activeColumn.dataset.columnTitle;
      showConfirm("Remover coluna?",`Tem certeza que deseja remover a coluna "${title}"? Os cards dela também serão removidos.`,async()=>{
        try{await api("/api/colunas",{method:"DELETE",body:JSON.stringify({id})}); showToast("Coluna removida",`A coluna "${title}" foi removida.`,"success"); await loadBoardFromApi();}
        catch(error){showToast("Erro",error.message,"error");}
      });
      hideContextMenu();
    });

    removeCardFromContext.addEventListener("click",()=>{
      if(!activeCard)return;
      const id=activeCard.dataset.cardId;
      const title=getCardById(id)?.titulo || "este card";
      showConfirm("Excluir card?",`Tem certeza que deseja excluir o card "${title}"?`,async()=>{
        try{await api("/api/cards",{method:"DELETE",body:JSON.stringify({id})}); showToast("Card excluído",`O card "${title}" foi removido.`,"success"); await loadBoardFromApi();}
        catch(error){showToast("Erro",error.message,"error");}
      });
      hideContextMenu();
    });

    saveNewColumnBtn.addEventListener("click",async()=>{
      const titulo=newColumnTitle.value.trim();
      if(!titulo){showToast("Campo obrigatório","Preencha o título da coluna.","error");newColumnTitle.focus();return;}
      try{await api("/api/colunas",{method:"POST",body:JSON.stringify({titulo})}); newColumnForm.reset(); modalNovaColuna.hide(); showToast("Coluna criada",`A coluna "${titulo}" foi adicionada.`,"success"); await loadBoardFromApi();}
      catch(error){showToast("Erro",error.message,"error");}
    });
    newColumnForm.addEventListener("submit",e=>{e.preventDefault();saveNewColumnBtn.click();});

    saveNewCardBtn.addEventListener("click",async()=>{
      const titulo=newCardTitle.value.trim(), descricao=newCardDescription.value.trim(), quem_pediu=newCardRequestedBy.value.trim(), responsavel_id=newCardResponsible.value||null;
      if(!titulo){showToast("Campo obrigatório","Preencha o título do card.","error");newCardTitle.focus();return;}
      if(!descricao){showToast("Campo obrigatório","Preencha a descrição do card.","error");newCardDescription.focus();return;}
      if(!quem_pediu){showToast("Campo obrigatório","Preencha quem pediu o card.","error");newCardRequestedBy.focus();return;}
      const coluna_id=targetColumnForNewCard?.dataset.columnId;
      if(!coluna_id){showToast("Erro","Escolha uma coluna para criar o card.","error");return;}
      try{
        await api("/api/cards",{method:"POST",body:JSON.stringify({coluna_id,titulo,descricao,quem_pediu,responsavel_id})});
        newCardForm.reset(); newCardResponsible.value=""; modalNovoCard.hide();
        showToast("Card criado","O card foi criado na coluna selecionada.","success");
        await loadBoardFromApi();
      }catch(error){showToast("Erro",error.message,"error");}
    });
    newCardForm.addEventListener("submit",e=>{e.preventDefault();saveNewCardBtn.click();});

    detailTitleDisplay.addEventListener("click",openTitleEditor);
    detailTitleInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();closeTitleEditor(true)}if(e.key==="Escape"){e.preventDefault();closeTitleEditor(false)}});
    detailTitleInput.addEventListener("blur",()=>closeTitleEditor(true));
    detailDescriptionDisplay.addEventListener("click",openDescriptionEditor);
    detailDescriptionInput.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();closeDescriptionEditor(false)}if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();closeDescriptionEditor(true)}});
    detailDescriptionInput.addEventListener("blur",()=>closeDescriptionEditor(true));

    logoutButton.addEventListener("click",async()=>{await fetch("/api/logout",{method:"POST"}); window.location.href="/index.html";});
    document.addEventListener("click",e=>{if(!columnContextMenu.contains(e.target)&&!cardContextMenu.contains(e.target))hideContextMenu();});
    document.addEventListener("scroll",hideContextMenu,true); window.addEventListener("resize",hideContextMenu); window.addEventListener("blur",hideContextMenu); document.addEventListener("keydown",e=>{if(e.key==="Escape")hideContextMenu();});

    async function startRealtime(){
      try{
        const config=await api("/api/realtime-config");
        const client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);
        client.channel("ch_dashboard_realtime").on("postgres_changes",{event:"INSERT",schema:"public",table:"ch_realtime_ping"},()=>loadBoardFromApi()).subscribe();
      }catch(e){}
    }

    (async function init(){
      await requireLogin();
      await loadUsuarios();
      await loadBoardFromApi();
      await startRealtime();
    })();
  </script>
</body>
</html>
