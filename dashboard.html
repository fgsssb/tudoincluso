<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.0.26.04.2026</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --bg-main: #1e1f22;
      --bg-panel: #2b2d31;
      --bg-panel-2: #313338;
      --bg-card: #2f3136;
      --bg-card-hover: #35373c;
      --bg-input: #1e1f22;
      --border-color: #3f4147;
      --border-soft: rgba(255, 255, 255, 0.06);
      --text-main: #dbdee1;
      --text-strong: #f2f3f5;
      --text-muted: #949ba4;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --success: #23a559;
      --danger: #f23f42;
      --danger-soft: rgba(242, 63, 66, 0.14);
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .page-wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px 14px 36px;
      position: relative;
    }

    .top-header {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 38px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon-create {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      padding: 0;
      font-size: 0.95rem;
      background: var(--primary);
      border: 0;
      color: #fff;
      font-weight: 700;
      box-shadow: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-icon-create:hover,
    .btn-icon-create:focus {
      background: var(--primary-hover);
      color: #fff;
      transform: translateY(-1px);
    }

    .mini-profile-btn {
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 0 10px 0 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .mini-profile-btn:hover,
    .mini-profile-btn:focus {
      background: var(--bg-panel-2);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--text-strong);
    }

    .mini-profile-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #404249;
      border: 0;
      color: #b5bac1;
      flex: 0 0 auto;
      font-size: 0.85rem;
    }

    .mini-profile-name {
      white-space: nowrap;
    }

    .mini-profile-menu,
    .dropdown-menu-dark {
      background: #111214;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .mini-profile-menu .dropdown-item {
      border-radius: 7px;
      font-size: 0.82rem;
      padding: 8px 10px;
      color: var(--text-main);
    }

    .mini-profile-menu .dropdown-item:hover {
      background: var(--danger-soft);
      color: #ffb3b4;
    }

    .board-shell {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    .kanban-scroll-area {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 2px 4px 10px 2px;
      scroll-behavior: smooth;
    }

    .kanban-scroll-area::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .kanban-scroll-area::-webkit-scrollbar-track,
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .kanban-scroll-area::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb {
      background: #3d3f45;
      border-radius: 999px;
      border: 2px solid var(--bg-main);
    }

    .kanban-scroll-area::-webkit-scrollbar-thumb:hover,
    .modal-body::-webkit-scrollbar-thumb:hover {
      background: #555861;
    }

    .kanban-board {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 12px;
      min-width: max-content;
      width: max-content;
      min-height: 100%;
      padding-right: 6px;
    }

    .kanban-column {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 10px;
      width: 292px;
      min-width: 292px;
      flex: 0 0 292px;
      min-height: 390px;
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .kanban-column.drag-over {
      border-color: rgba(88, 101, 242, 0.72);
      background: #30323a;
    }

    .kanban-column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px 9px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .kanban-column-header h2 {
      font-size: 0.88rem;
      line-height: 1.2;
      font-weight: 800;
      margin: 0;
      color: var(--text-strong);
      cursor: text;
      border-radius: 6px;
      padding: 4px 6px;
      margin-left: -6px;
      min-width: 40px;
      letter-spacing: 0.01em;
    }

    .kanban-column-header h2:hover {
      background: rgba(255, 255, 255, 0.04);
      outline: 1px solid rgba(255, 255, 255, 0.08);
    }

    .kanban-column-header h2:focus {
      background: var(--bg-input);
      outline: 1px solid var(--primary);
      box-shadow: none;
    }

    .kanban-column-header strong {
      background: #3a3c43;
      color: #c9cdfb;
      border: 0;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .column-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 260px;
    }

    .ticket-card {
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      box-shadow: none;
      backdrop-filter: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .ticket-card:hover {
      transform: translateY(-1px);
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.11);
      box-shadow: none;
    }

    .ticket-card.dragging {
      opacity: 0.55;
      transform: rotate(1deg);
    }

    .ticket-title {
      font-size: 0.9rem;
      font-weight: 800;
      margin: 0 0 6px;
      color: var(--text-strong);
      line-height: 1.25;
    }

    .ticket-description {
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.4;
      margin-bottom: 0;
    }

    .ticket-mini-info {
      display: none;
    }

    .date-category-card {
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 16px;
      padding: 12px;
    }

    .date-category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.10);
    }

    .date-category-title-wrap {
      min-width: 0;
    }

    .date-category-title {
      font-size: 0.92rem;
      font-weight: 900;
      color: #f8fafc;
      margin: 0;
      cursor: text;
      border-radius: 8px;
      padding: 3px 5px;
      margin-left: -5px;
    }

    .date-category-title:hover,
    .date-category-title:focus {
      background: rgba(56, 189, 248, 0.08);
      outline: 1px dashed rgba(56, 189, 248, 0.24);
    }

    .date-category-date {
      display: block;
      color: var(--text-muted);
      font-size: 0.76rem;
      margin-top: 2px;
    }

    .date-category-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.10);
      border: 1px solid rgba(56, 189, 248, 0.22);
      flex: 0 0 auto;
    }

    .date-category-dropzone {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 44px;
      border-radius: 12px;
      transition: background 0.16s ease, outline 0.16s ease;
    }

    .date-category-dropzone:empty::before {
      content: "Arraste cards para cá";
      color: rgba(148, 163, 184, 0.58);
      font-size: 0.78rem;
      padding: 9px 10px;
      border: 1px dashed rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      display: block;
    }

    .date-category-dropzone.drag-over {
      background: rgba(56, 189, 248, 0.06);
      outline: 1px dashed rgba(56, 189, 248, 0.32);
    }

    .date-category-dropzone .ticket-card {
      box-shadow: none;
    }

    .app-version {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 40;
      font-size: 0.72rem;
      color: #80848e;
      background: rgba(30, 31, 34, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      padding: 5px 9px;
      line-height: 1;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .context-menu {
      position: fixed;
      z-index: 3000;
      min-width: 200px;
      background: #111214;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.42);
      padding: 6px;
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-menu-title {
      padding: 6px 9px 8px;
      font-size: 0.68rem;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 5px;
    }

    .context-menu-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text-main);
      text-align: left;
      padding: 8px 9px;
      border-radius: 7px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .context-menu-item:hover {
      background: #2b2d31;
    }

    .context-menu-item i {
      color: #b5bac1;
    }

    .context-menu-danger {
      color: #ffb3b4;
    }

    .context-menu-danger:hover {
      background: var(--danger-soft);
    }

    .context-menu-danger i {
      color: #ffb3b4;
    }

    .app-toast-container {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(330px, calc(100vw - 28px));
      pointer-events: none;
    }

    .app-toast {
      background: #111214;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.42);
      display: flex;
      align-items: flex-start;
      gap: 9px;
      animation: toastIn 0.16s ease-out;
      pointer-events: auto;
    }

    .app-toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: rgba(88, 101, 242, 0.14);
      color: #c9cdfb;
      border: 0;
      font-size: 0.8rem;
    }

    .app-toast.error .app-toast-icon {
      background: rgba(242, 63, 66, 0.14);
      color: #ffb3b4;
    }

    .app-toast.success .app-toast-icon {
      background: rgba(35, 165, 89, 0.14);
      color: #8ee8b6;
    }

    .app-toast-title {
      font-weight: 800;
      font-size: 0.82rem;
      margin-bottom: 1px;
      color: var(--text-strong);
    }

    .app-toast-message {
      color: var(--text-muted);
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .app-toast.hide {
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
      transition: 0.16s ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-content {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    }

    .modal-header,
    .modal-footer {
      border-color: rgba(255, 255, 255, 0.06);
      padding: 12px 14px;
    }

    .modal-body {
      padding: 14px;
    }

    .modal-title {
      font-size: 0.98rem;
      color: var(--text-strong);
    }

    .btn-close {
      filter: invert(1) grayscale(100%);
      opacity: 0.65;
    }

    .btn-close:hover {
      opacity: 1;
    }

    .btn,
    .dropdown-item {
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .btn-info,
    .btn-danger {
      border: 0;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      padding: 8px 12px;
    }

    .btn-info {
      background: var(--primary);
      color: #fff;
    }

    .btn-info:hover,
    .btn-info:focus {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover,
    .btn-danger:focus {
      background: #d83c3e;
      color: #fff;
    }

    .btn-outline-light {
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      padding: 8px 12px;
    }

    .btn-outline-light:hover,
    .btn-outline-light:focus {
      background: #3a3c43;
      border-color: #3a3c43;
      color: #fff;
    }

    .form-label {
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-control,
    .form-select {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      min-height: 40px;
    }

    textarea.form-control {
      min-height: 92px;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: var(--bg-input);
      color: var(--text-main);
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.22);
    }

    .form-control::placeholder {
      color: #72767d;
    }

    .form-select option {
      background: var(--bg-input);
      color: var(--text-main);
    }

    .meta-box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .meta-label {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .meta-value {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-strong);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 9px 10px;
    }

    .log-date {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .log-text {
      font-size: 0.82rem;
      color: var(--text-main);
      line-height: 1.35;
    }

    .editable-title,
    .editable-description {
      cursor: text;
      border-radius: var(--radius-sm);
      padding: 4px 6px;
      margin-left: -6px;
      transition: background 0.15s ease, outline 0.15s ease;
    }

    .editable-title:hover,
    .editable-description:hover {
      background: rgba(255, 255, 255, 0.04);
      outline: 1px solid rgba(255, 255, 255, 0.08);
    }

    .edit-inline-input,
    .edit-inline-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--primary);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      outline: none;
      box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.22);
    }

    .edit-inline-input {
      font-size: 1.25rem;
      font-weight: 800;
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .edit-inline-textarea {
      font-size: 0.9rem;
      line-height: 1.45;
      padding: 10px 11px;
      min-height: 92px;
      resize: vertical;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .page-wrapper {
        padding: 12px 10px 38px;
      }

      .top-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .kanban-column {
        width: 280px;
        min-width: 280px;
        flex-basis: 280px;
      }
    }
  </style>
</head>

<body>
  <div class="app-toast-container" id="appToastContainer"></div>

  <main class="page-wrapper">
    <section class="top-header">
      <div class="top-actions">
        <div class="mini-profile dropdown">
          <button
            class="mini-profile-btn dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            title="Usuário logado"
          >
            <span class="mini-profile-avatar">
              <i class="bi bi-person-fill"></i>
            </span>
            <span class="mini-profile-name">USUÁRIO LOGADO</span>
          </button>

          <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end mini-profile-menu">
            <li>
              <button class="dropdown-item text-danger" type="button" id="logoutButton">
                <i class="bi bi-box-arrow-right me-2"></i>Sair da conta
              </button>
            </li>
          </ul>
        </div>

        <button
          class="btn btn-icon-create"
          data-bs-toggle="modal"
          data-bs-target="#modalNovaColuna"
          title="Criar coluna"
        >
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>
    </section>

    <div class="board-shell">
      <div class="kanban-scroll-area">
        <section class="kanban-board" id="kanbanBoard"></section>
      </div>
    </div>

    <div class="app-version">1.0.26.04.2026</div>
  </main>

  <div id="columnContextMenu" class="context-menu">
    <div class="context-menu-title" id="columnContextMenuTitle">Ações da coluna</div>

    <button type="button" class="context-menu-item" id="addCardFromContext">
      <i class="bi bi-plus-square"></i>
      Adicionar novo card
    </button>

    <button type="button" class="context-menu-item" id="addDateCategoryFromContext">
      <i class="bi bi-calendar-plus"></i>
      Criar categoria de data
    </button>

    <button type="button" class="context-menu-item context-menu-danger" id="removeColumnFromContext">
      <i class="bi bi-trash"></i>
      Remover coluna
    </button>
  </div>

  <div id="cardContextMenu" class="context-menu">
    <div class="context-menu-title">Ações do card</div>

    <button type="button" class="context-menu-item context-menu-danger" id="removeCardFromContext">
      <i class="bi bi-trash"></i>
      Excluir card
    </button>
  </div>


  <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="confirmTitle">Confirmar ação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <p class="mb-0 text-secondary" id="confirmMessage">Tem certeza que deseja continuar?</p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger fw-bold" id="confirmOkBtn">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalNovaColuna" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const toastContainer = document.getElementById("appToastContainer");
    const columnContextMenu = document.getElementById("columnContextMenu");
    const cardContextMenu = document.getElementById("cardContextMenu");
    const columnContextMenuTitle = document.getElementById("columnContextMenuTitle");
    const addCardFromContext = document.getElementById("addCardFromContext");
    const addDateCategoryFromContext = document.getElementById("addDateCategoryFromContext");
    const removeColumnFromContext = document.getElementById("removeColumnFromContext");
    const removeCardFromContext = document.getElementById("removeCardFromContext");
    const kanbanBoard = document.getElementById("kanbanBoard");

    const modalNovoCard = bootstrap.Modal.getOrCreateInstance(document.getElementById("modalNovoCard"));
    const modalNovaColuna = bootstrap.Modal.getOrCreateInstance(document.getElementById("modalNovaColuna"));
    const modalCategoriaData = bootstrap.Modal.getOrCreateInstance(document.getElementById("modalCategoriaData"));
    const modalDetalhesCard = bootstrap.Modal.getOrCreateInstance(document.getElementById("modalDetalhesCard"));
    const modalConfirmacaoEl = document.getElementById("modalConfirmacao");
    const modalConfirmacao = bootstrap.Modal.getOrCreateInstance(modalConfirmacaoEl);
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmMessage = document.getElementById("confirmMessage");
    const confirmOkBtn = document.getElementById("confirmOkBtn");

    const newColumnForm = document.getElementById("newColumnForm");
    const newColumnTitle = document.getElementById("newColumnTitle");
    const saveNewColumnBtn = document.getElementById("saveNewColumnBtn");

    const dateCategoryForm = document.getElementById("dateCategoryForm");
    const dateCategoryTitle = document.getElementById("dateCategoryTitle");
    const dateCategoryDate = document.getElementById("dateCategoryDate");
    const saveDateCategoryBtn = document.getElementById("saveDateCategoryBtn");

    const newCardForm = document.getElementById("newCardForm");
    const newCardTitle = document.getElementById("newCardTitle");
    const newCardDescription = document.getElementById("newCardDescription");
    const newCardRequestedBy = document.getElementById("newCardRequestedBy");
    const newCardResponsible = document.getElementById("newCardResponsible");
    const saveNewCardBtn = document.getElementById("saveNewCardBtn");

    const detailTitleDisplay = document.getElementById("detailTitleDisplay");
    const detailTitleInput = document.getElementById("detailTitleInput");
    const detailDescriptionDisplay = document.getElementById("detailDescriptionDisplay");
    const detailDescriptionInput = document.getElementById("detailDescriptionInput");
    const detailRequestedBy = document.getElementById("detailRequestedBy");
    const detailResponsible = document.getElementById("detailResponsible");
    const detailCurrentColumn = document.getElementById("detailCurrentColumn");
    const cardLogList = document.getElementById("cardLogList");

    let loggedUser = null;
    let users = [];
    let colunas = [];
    let cards = [];
    let logs = [];
    let activeColumn = null;
    let activeCard = null;
    let currentCard = null;
    let targetColumnForNewCard = null;
    let draggedCard = null;
    let realtimeClient = null;

    function showConfirm({ title = "Confirmar ação", message = "Tem certeza que deseja continuar?", confirmText = "Confirmar", danger = true } = {}) {
      return new Promise((resolve) => {
        confirmTitle.textContent = title;
        confirmMessage.textContent = message;
        confirmOkBtn.textContent = confirmText;
        confirmOkBtn.className = danger ? "btn btn-danger fw-bold" : "btn btn-info fw-bold";

        let resolved = false;

        function cleanup() {
          confirmOkBtn.removeEventListener("click", handleConfirm);
          modalConfirmacaoEl.removeEventListener("hidden.bs.modal", handleHidden);
        }

        function handleConfirm() {
          resolved = true;
          cleanup();
          modalConfirmacao.hide();
          resolve(true);
        }

        function handleHidden() {
          cleanup();
          if (!resolved) resolve(false);
        }

        confirmOkBtn.addEventListener("click", handleConfirm);
        modalConfirmacaoEl.addEventListener("hidden.bs.modal", handleHidden, { once: true });
        modalConfirmacao.show();
      });
    }

    function showToast(title, message, type = "info") {
      const toast = document.createElement("div");
      toast.className = `app-toast ${type}`;

      const icon = type === "error" ? "bi-exclamation-triangle" : type === "success" ? "bi-check2-circle" : "bi-info-circle";

      toast.innerHTML = `
        <div class="app-toast-icon"><i class="bi ${icon}"></i></div>
        <div>
          <div class="app-toast-title">${title}</div>
          <div class="app-toast-message">${message}</div>
        </div>
      `;

      toastContainer.appendChild(toast);
      setTimeout(() => toast.classList.add("hide"), 2600);
      setTimeout(() => toast.remove(), 2850);
    }

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      if (response.status === 401) {
        window.location.href = "/index.html";
        return null;
      }

      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.ok === false) {
        throw new Error(data.message || "Erro na requisição.");
      }

      return data;
    }

    async function requireLogin() {
      const response = await fetch("/api/me");

      if (!response.ok) {
        window.location.href = "/index.html";
        return;
      }

      const data = await response.json();
      loggedUser = data.user;

      const profileName = document.querySelector(".mini-profile-name");
      if (profileName) {
        profileName.textContent = loggedUser.nome_exibicao || loggedUser.usuario;
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async function () {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/index.html";
    });

    function hideContextMenu() {
      columnContextMenu.classList.remove("show");
      cardContextMenu.classList.remove("show");
    }

    function positionMenu(menu, x, y) {
      hideContextMenu();
      menu.classList.add("show");

      const menuWidth = menu.offsetWidth;
      const menuHeight = menu.offsetHeight;
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      let left = x;
      let top = y;

      if (left + menuWidth > viewportWidth - 10) left = viewportWidth - menuWidth - 10;
      if (top + menuHeight > viewportHeight - 10) top = viewportHeight - menuHeight - 10;

      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function showColumnContextMenu(x, y, column) {
      activeColumn = column;
      activeCard = null;
      const title = column.dataset.columnTitle || "Coluna";
      columnContextMenuTitle.textContent = `Ações da coluna: ${title}`;
      positionMenu(columnContextMenu, x, y);
    }

    function showCardContextMenu(x, y, card) {
      activeCard = card;
      activeColumn = null;
      positionMenu(cardContextMenu, x, y);
    }

    function updateColumnCounts() {
      document.querySelectorAll(".kanban-column").forEach((column) => {
        const count = column.querySelectorAll(".ticket-card").length;
        const badge = column.querySelector(".kanban-column-header strong");
        if (badge) badge.textContent = count;
      });
    }

    function getCardById(id) {
      return cards.find((card) => card.id === id);
    }

    function getColumnById(id) {
      return colunas.find((coluna) => coluna.id === id);
    }

    function getUserNameById(id) {
      if (!id) return "Sem responsável";
      const user = users.find((item) => item.id === id);
      return user?.nome_exibicao || user?.usuario || "Sem responsável";
    }

    function formatDateBR(dateValue) {
      if (!dateValue) return "Sem data";
      const [year, month, day] = String(dateValue).split("-");
      if (!year || !month || !day) return dateValue;
      return `${day}/${month}/${year}`;
    }

    function getTodayISO() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderResponsibleOptions() {
      newCardResponsible.innerHTML = `<option value="">Sem responsável</option>`;

      users.forEach((user) => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = user.nome_exibicao || user.usuario;
        newCardResponsible.appendChild(option);
      });
    }

    function renderLogs(cardId) {
      const cardLogs = logs.filter((log) => log.card_id === cardId);

      cardLogList.innerHTML = "";

      if (!cardLogs.length) {
        const empty = document.createElement("div");
        empty.className = "log-item";
        empty.innerHTML = `
          <div class="log-date">Sem registros</div>
          <div class="log-text">Nenhum acontecimento registrado ainda.</div>
        `;
        cardLogList.appendChild(empty);
        return;
      }

      cardLogs.forEach((log) => {
        const item = document.createElement("div");
        item.className = "log-item";

        const date = new Date(log.criado_em);
        const formattedDate = date.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });

        item.innerHTML = `
          <div class="log-date">${formattedDate}</div>
          <div class="log-text">${log.acao}</div>
        `;

        cardLogList.appendChild(item);
      });
    }

    function fillDetailsModal(cardElement) {
      const card = getCardById(cardElement.dataset.cardId);
      if (!card) return;

      currentCard = cardElement;

      const responsavelNome =
        card.responsavel?.nome_exibicao ||
        card.responsavel?.usuario ||
        getUserNameById(card.responsavel_id);

      detailTitleDisplay.textContent = card.titulo;
      detailTitleInput.value = card.titulo;
      detailDescriptionDisplay.textContent = card.descricao;
      detailDescriptionInput.value = card.descricao;
      detailRequestedBy.textContent = card.quem_pediu;
      detailResponsible.textContent = responsavelNome;
      detailCurrentColumn.textContent = card.coluna?.titulo || getColumnById(card.coluna_id)?.titulo || "";
      renderLogs(card.id);

      closeTitleEditor(false);
      closeDescriptionEditor(false);
    }

    function openTitleEditor() {
      if (!currentCard) return;
      detailTitleInput.value = detailTitleDisplay.textContent.trim();
      detailTitleDisplay.classList.add("d-none");
      detailTitleInput.classList.remove("d-none");
      detailTitleInput.focus();
      detailTitleInput.select();
    }

    async function closeTitleEditor(save = true) {
      if (save && currentCard) {
        const cardId = currentCard.dataset.cardId;
        const newTitle = detailTitleInput.value.trim() || "Sem título";

        try {
          await apiFetch("/api/cards", {
            method: "PATCH",
            body: JSON.stringify({
              id: cardId,
              titulo: newTitle
            })
          });

          await loadBoardFromApi(false);
        } catch (error) {
          showToast("Erro", error.message, "error");
        }
      }

      detailTitleInput.classList.add("d-none");
      detailTitleDisplay.classList.remove("d-none");
    }

    function openDescriptionEditor() {
      if (!currentCard) return;
      detailDescriptionInput.value = detailDescriptionDisplay.textContent.trim();
      detailDescriptionDisplay.classList.add("d-none");
      detailDescriptionInput.classList.remove("d-none");
      detailDescriptionInput.focus();
    }

    async function closeDescriptionEditor(save = true) {
      if (save && currentCard) {
        const cardId = currentCard.dataset.cardId;
        const newDescription = detailDescriptionInput.value.trim() || "Sem descrição.";

        try {
          await apiFetch("/api/cards", {
            method: "PATCH",
            body: JSON.stringify({
              id: cardId,
              descricao: newDescription
            })
          });

          await loadBoardFromApi(false);
        } catch (error) {
          showToast("Erro", error.message, "error");
        }
      }

      detailDescriptionInput.classList.add("d-none");
      detailDescriptionDisplay.classList.remove("d-none");
    }

    function createColumnElement(coluna) {
      const column = document.createElement("div");
      column.className = "kanban-column";
      column.dataset.columnId = coluna.id;
      column.dataset.columnTitle = coluna.titulo;

      column.innerHTML = `
        <div class="kanban-column-header">
          <h2>${coluna.titulo}</h2>
          <strong>0</strong>
        </div>
        <div class="column-cards"></div>
      `;

      attachColumnEvents(column);
      return column;
    }

    function createDateCategoryElement(card) {
      const article = document.createElement("article");
      article.className = "date-category-card";
      article.dataset.cardId = card.id;
      article.dataset.categoryId = card.id;
      article.dataset.colunaId = card.coluna_id;

      article.innerHTML = `
        <div class="date-category-header">
          <div class="date-category-title-wrap">
            <h3 class="date-category-title" title="Clique para editar o título"></h3>
            <span class="date-category-date"></span>
          </div>
          <span class="date-category-icon"><i class="bi bi-calendar-event"></i></span>
        </div>
        <div class="date-category-dropzone"></div>
      `;

      article.querySelector(".date-category-title").textContent = card.titulo;
      article.querySelector(".date-category-date").textContent = formatDateBR(card.data_referencia);

      attachDateCategoryEvents(article);
      return article;
    }

    function createCardElement(card) {
      if (card.tipo === "categoria_data") {
        return createDateCategoryElement(card);
      }

      const responsavelNome =
        card.responsavel?.nome_exibicao ||
        card.responsavel?.usuario ||
        getUserNameById(card.responsavel_id);

      const article = document.createElement("article");
      article.className = "ticket-card ticket-open-modal";
      article.setAttribute("draggable", "true");
      article.dataset.cardId = card.id;
      article.dataset.categoriaId = card.categoria_id || "";
      article.setAttribute("role", "button");
      article.setAttribute("tabindex", "0");

      article.innerHTML = `
        <h3 class="ticket-title"></h3>
        <p class="ticket-description"></p>
        <div class="ticket-mini-info">
          <span><i class="bi bi-person"></i> Quem pediu: ${card.quem_pediu}</span>
          <span><i class="bi bi-person-check"></i> Responsável: ${responsavelNome}</span>
        </div>
      `;

      article.querySelector(".ticket-title").textContent = card.titulo;
      article.querySelector(".ticket-description").textContent = card.descricao;

      attachCardEvents(article);
      return article;
    }

    function attachCardEvents(card) {
      card.addEventListener("click", function () {
        fillDetailsModal(card);
        modalDetalhesCard.show();
      });

      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fillDetailsModal(card);
          modalDetalhesCard.show();
        }
      });

      card.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
        showCardContextMenu(e.clientX, e.clientY, card);
      });

      card.addEventListener("dragstart", function () {
        draggedCard = card;
        card.classList.add("dragging");
      });

      card.addEventListener("dragend", function () {
        card.classList.remove("dragging");
        draggedCard = null;

        document.querySelectorAll(".kanban-column").forEach((column) => {
          column.classList.remove("drag-over");
        });
      });
    }

    function attachDateCategoryEvents(categoryElement) {
      const titleElement = categoryElement.querySelector(".date-category-title");
      const dropzone = categoryElement.querySelector(".date-category-dropzone");

      titleElement.addEventListener("click", function (e) {
        e.stopPropagation();
        titleElement.setAttribute("contenteditable", "true");
        titleElement.dataset.originalTitle = titleElement.textContent.trim();
        titleElement.focus();

        const range = document.createRange();
        range.selectNodeContents(titleElement);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      });

      titleElement.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          titleElement.blur();
        }

        if (e.key === "Escape") {
          e.preventDefault();
          titleElement.textContent = titleElement.dataset.originalTitle || titleElement.textContent.trim();
          titleElement.blur();
        }
      });

      titleElement.addEventListener("blur", async function () {
        const oldTitle = titleElement.dataset.originalTitle || "Categoria";
        const newTitle = titleElement.textContent.trim();
        titleElement.removeAttribute("contenteditable");

        if (!newTitle) {
          titleElement.textContent = oldTitle;
          showToast("Campo obrigatório", "O título da categoria não pode ficar vazio.", "error");
          return;
        }

        if (oldTitle === newTitle) return;

        try {
          await apiFetch("/api/cards", {
            method: "PATCH",
            body: JSON.stringify({
              id: categoryElement.dataset.categoryId,
              titulo: newTitle
            })
          });

          showToast("Categoria atualizada", `A categoria agora se chama "${newTitle}".`, "success");
          await loadBoardFromApi(false);
        } catch (error) {
          titleElement.textContent = oldTitle;
          showToast("Erro", error.message, "error");
        }
      });

      categoryElement.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
        activeCard = categoryElement;
        activeColumn = null;
        positionMenu(cardContextMenu, e.clientX, e.clientY);
      });

      dropzone.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add("drag-over");
      });

      dropzone.addEventListener("dragleave", function () {
        dropzone.classList.remove("drag-over");
      });

      dropzone.addEventListener("drop", async function (e) {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove("drag-over");

        if (!draggedCard) return;

        try {
          await apiFetch("/api/cards", {
            method: "PATCH",
            body: JSON.stringify({
              id: draggedCard.dataset.cardId,
              coluna_id: categoryElement.dataset.colunaId,
              categoria_id: categoryElement.dataset.categoryId
            })
          });

          await loadBoardFromApi(false);
        } catch (error) {
          showToast("Erro", error.message, "error");
        }
      });
    }

    function attachColumnEvents(column) {
      const columnTitle = column.querySelector(".kanban-column-header h2");

      columnTitle.addEventListener("click", function (e) {
        e.stopPropagation();
        columnTitle.setAttribute("contenteditable", "true");
        columnTitle.dataset.originalTitle = column.dataset.columnTitle;
        columnTitle.focus();

        const range = document.createRange();
        range.selectNodeContents(columnTitle);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      });

      columnTitle.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          columnTitle.blur();
        }

        if (e.key === "Escape") {
          e.preventDefault();
          columnTitle.textContent = columnTitle.dataset.originalTitle || column.dataset.columnTitle;
          columnTitle.blur();
        }
      });

      columnTitle.addEventListener("blur", async function () {
        const oldTitle = column.dataset.columnTitle;
        const newTitle = columnTitle.textContent.trim();

        columnTitle.removeAttribute("contenteditable");

        if (!newTitle) {
          columnTitle.textContent = oldTitle;
          showToast("Campo obrigatório", "O título da coluna não pode ficar vazio.", "error");
          return;
        }

        if (oldTitle === newTitle) return;

        try {
          await apiFetch("/api/colunas", {
            method: "PATCH",
            body: JSON.stringify({
              id: column.dataset.columnId,
              titulo: newTitle
            })
          });

          showToast("Coluna renomeada", `A coluna "${oldTitle}" agora se chama "${newTitle}".`, "success");
          await loadBoardFromApi(false);
        } catch (error) {
          columnTitle.textContent = oldTitle;
          showToast("Erro", error.message, "error");
        }
      });

      column.addEventListener("contextmenu", function (e) {
        if (e.target.closest(".ticket-card")) return;
        e.preventDefault();
        showColumnContextMenu(e.clientX, e.clientY, column);
      });

      column.addEventListener("dragover", function (e) {
        e.preventDefault();
        column.classList.add("drag-over");
      });

      column.addEventListener("dragleave", function () {
        column.classList.remove("drag-over");
      });

      column.addEventListener("drop", async function (e) {
        e.preventDefault();
        column.classList.remove("drag-over");

        if (!draggedCard) return;

        const cardId = draggedCard.dataset.cardId;
        const colunaId = column.dataset.columnId;

        try {
          await apiFetch("/api/cards", {
            method: "PATCH",
            body: JSON.stringify({
              id: cardId,
              coluna_id: colunaId,
              categoria_id: null
            })
          });

          await loadBoardFromApi(false);
        } catch (error) {
          showToast("Erro", error.message, "error");
        }
      });
    }

    async function loadUsersFromApi() {
      try {
        const data = await apiFetch("/api/usuarios");
        users = data.usuarios || [];
        renderResponsibleOptions();
      } catch (error) {
        users = [];
      }
    }

    async function loadLogsFromApi() {
      try {
        const response = await fetch("/api/logs");

        if (!response.ok) {
          logs = [];
          return;
        }

        const data = await response.json();
        logs = data.logs || [];
      } catch (error) {
        logs = [];
      }
    }

    async function loadBoardFromApi(showLoadingToast = false) {
      if (showLoadingToast) {
        showToast("Carregando", "Atualizando quadro...", "info");
      }

      const [colunasData, cardsData] = await Promise.all([
        apiFetch("/api/colunas"),
        apiFetch("/api/cards")
      ]);

      if (!colunasData || !cardsData) return;

      colunas = colunasData.colunas || [];
      cards = cardsData.cards || [];

      await loadLogsFromApi();

      kanbanBoard.innerHTML = "";

      colunas.forEach((coluna) => {
        const columnElement = createColumnElement(coluna);
        const cardsContainer = columnElement.querySelector(".column-cards");
        const cardsDaColuna = cards.filter((card) => card.coluna_id === coluna.id);
        const categoriasDaColuna = cardsDaColuna.filter((card) => card.tipo === "categoria_data");
        const cardsNormais = cardsDaColuna.filter((card) => card.tipo !== "categoria_data");

        categoriasDaColuna.forEach((categoria) => {
          const categoriaElement = createCardElement(categoria);
          const dropzone = categoriaElement.querySelector(".date-category-dropzone");

          cardsNormais
            .filter((card) => card.categoria_id === categoria.id)
            .forEach((card) => {
              dropzone.appendChild(createCardElement(card));
            });

          cardsContainer.appendChild(categoriaElement);
        });

        cardsNormais
          .filter((card) => !card.categoria_id)
          .forEach((card) => {
            cardsContainer.appendChild(createCardElement(card));
          });

        kanbanBoard.appendChild(columnElement);
      });

      updateColumnCounts();

      if (currentCard) {
        const updatedCurrentCard = document.querySelector(`[data-card-id="${currentCard.dataset.cardId}"]`);
        if (updatedCurrentCard) {
          fillDetailsModal(updatedCurrentCard);
        }
      }
    }

async function startRealtime() {
  try {
    const response = await fetch("/api/realtime-config");
    const config = await response.json().catch(() => ({}));

    if (!response.ok || !config.ok) {
      showToast(
        "Realtime",
        config.message || "Não foi possível buscar configuração do realtime.",
        "error"
      );
      return;
    }

    if (!window.supabase) {
      showToast("Realtime", "Biblioteca do Supabase não carregou.", "error");
      return;
    }

    realtimeClient = window.supabase.createClient(
      config.supabaseUrl,
      config.supabaseAnonKey
    );

    realtimeClient
      .channel("ch_dashboard_realtime_" + Math.random())
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "ch_realtime_ping"
        },
        async (payload) => {
          console.log("PING REALTIME RECEBIDO:", payload);

          await loadBoardFromApi(false);
        }
      )
      .subscribe((status, err) => {
        console.log("Realtime status:", status, err || "");

        if (
          status === "CHANNEL_ERROR" ||
          status === "TIMED_OUT" ||
          status === "CLOSED"
        ) {
          showToast(
            "Realtime",
            `Erro na conexão realtime: ${status}`,
            "error"
          );
        }
      });
  } catch (error) {
    console.error("Erro ao conectar realtime:", error);

    showToast(
      "Realtime",
      error.message || "Erro ao conectar realtime.",
      "error"
    );
  }
}
    addCardFromContext.addEventListener("click", function () {
      targetColumnForNewCard = activeColumn;
      hideContextMenu();

      newCardForm.reset();
      newCardResponsible.value = "";
      modalNovoCard.show();
    });

    addDateCategoryFromContext.addEventListener("click", function () {
      targetColumnForNewCard = activeColumn;
      hideContextMenu();

      dateCategoryForm.reset();
      dateCategoryTitle.value = "Hoje";
      dateCategoryDate.value = getTodayISO();
      modalCategoriaData.show();
    });

    saveDateCategoryBtn.addEventListener("click", async function () {
      const titulo = dateCategoryTitle.value.trim();
      const data_referencia = dateCategoryDate.value;

      if (!targetColumnForNewCard) {
        showToast("Erro", "Nenhuma coluna selecionada para criar a categoria.", "error");
        return;
      }

      if (!titulo) {
        showToast("Campo obrigatório", "Preencha o título da categoria.", "error");
        dateCategoryTitle.focus();
        return;
      }

      if (!data_referencia) {
        showToast("Campo obrigatório", "Preencha a data da categoria.", "error");
        dateCategoryDate.focus();
        return;
      }

      try {
        await apiFetch("/api/cards", {
          method: "POST",
          body: JSON.stringify({
            coluna_id: targetColumnForNewCard.dataset.columnId,
            titulo,
            descricao: "",
            quem_pediu: "Categoria de data",
            responsavel_id: null,
            tipo: "categoria_data",
            data_referencia
          })
        });

        dateCategoryForm.reset();
        modalCategoriaData.hide();
        showToast("Categoria criada", `A categoria "${titulo}" foi adicionada.`, "success");
        await loadBoardFromApi(false);
      } catch (error) {
        showToast("Erro", error.message, "error");
      }
    });

    dateCategoryForm.addEventListener("submit", function (e) {
      e.preventDefault();
      saveDateCategoryBtn.click();
    });

    removeColumnFromContext.addEventListener("click", async function () {
      if (!activeColumn) return;

      const id = activeColumn.dataset.columnId;
      const title = activeColumn.dataset.columnTitle;

      const confirmed = await showConfirm({
        title: "Remover coluna",
        message: `Tem certeza que deseja remover a coluna "${title}"?`,
        confirmText: "Remover coluna",
        danger: true
      });

      if (!confirmed) {
        hideContextMenu();
        return;
      }

      try {
        await apiFetch("/api/colunas", {
          method: "DELETE",
          body: JSON.stringify({ id })
        });

        hideContextMenu();
        showToast("Coluna removida", `A coluna "${title}" foi removida.`, "success");
        await loadBoardFromApi(false);
      } catch (error) {
        showToast("Erro", error.message, "error");
      }
    });

    removeCardFromContext.addEventListener("click", async function () {
      if (!activeCard) return;

      const id = activeCard.dataset.cardId;
      const title = activeCard.querySelector(".ticket-title")?.textContent?.trim() || activeCard.querySelector(".date-category-title")?.textContent?.trim() || "este card";

      const confirmed = await showConfirm({
        title: "Excluir card",
        message: `Tem certeza que deseja excluir o card "${title}"?`,
        confirmText: "Excluir card",
        danger: true
      });

      if (!confirmed) {
        hideContextMenu();
        return;
      }

      try {
        await apiFetch("/api/cards", {
          method: "DELETE",
          body: JSON.stringify({ id })
        });

        hideContextMenu();
        showToast("Card excluído", `O card "${title}" foi removido.`, "success");
        await loadBoardFromApi(false);
      } catch (error) {
        showToast("Erro", error.message, "error");
      }
    });

    saveNewColumnBtn.addEventListener("click", async function () {
      const titulo = newColumnTitle.value.trim();

      if (!titulo) {
        showToast("Campo obrigatório", "Preencha o título da coluna.", "error");
        newColumnTitle.focus();
        return;
      }

      try {
        await apiFetch("/api/colunas", {
          method: "POST",
          body: JSON.stringify({ titulo })
        });

        newColumnForm.reset();
        modalNovaColuna.hide();
        showToast("Coluna criada", `A coluna "${titulo}" foi adicionada.`, "success");
        await loadBoardFromApi(false);
      } catch (error) {
        showToast("Erro", error.message, "error");
      }
    });

    newColumnForm.addEventListener("submit", function (e) {
      e.preventDefault();
      saveNewColumnBtn.click();
    });

    saveNewCardBtn.addEventListener("click", async function () {
      const titulo = newCardTitle.value.trim();
      const descricao = newCardDescription.value.trim();
      const quem_pediu = newCardRequestedBy.value.trim();
      const responsavel_id = newCardResponsible.value || null;

      if (!titulo) {
        showToast("Campo obrigatório", "Preencha o título do card.", "error");
        newCardTitle.focus();
        return;
      }

      if (!descricao) {
        showToast("Campo obrigatório", "Preencha a descrição do card.", "error");
        newCardDescription.focus();
        return;
      }

      if (!quem_pediu) {
        showToast("Campo obrigatório", "Preencha quem pediu o card.", "error");
        newCardRequestedBy.focus();
        return;
      }

      if (!targetColumnForNewCard) {
        showToast("Erro", "Nenhuma coluna selecionada para criar o card.", "error");
        return;
      }

      try {
        await apiFetch("/api/cards", {
          method: "POST",
          body: JSON.stringify({
            coluna_id: targetColumnForNewCard.dataset.columnId,
            titulo,
            descricao,
            quem_pediu,
            responsavel_id,
            categoria_id: null,
            tipo: "chamado"
          })
        });

        newCardForm.reset();
        newCardResponsible.value = "";
        modalNovoCard.hide();
        showToast("Card criado", "O card foi criado na coluna selecionada.", "success");
        await loadBoardFromApi(false);
      } catch (error) {
        showToast("Erro", error.message, "error");
      }
    });

    newCardForm.addEventListener("submit", function (e) {
      e.preventDefault();
      saveNewCardBtn.click();
    });

    detailTitleDisplay.addEventListener("click", openTitleEditor);

    detailTitleInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        closeTitleEditor(true);
      }

      if (e.key === "Escape") {
        e.preventDefault();
        closeTitleEditor(false);
      }
    });

    detailTitleInput.addEventListener("blur", function () {
      closeTitleEditor(true);
    });

    detailDescriptionDisplay.addEventListener("click", openDescriptionEditor);

    detailDescriptionInput.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeDescriptionEditor(false);
      }

      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        closeDescriptionEditor(true);
      }
    });

    detailDescriptionInput.addEventListener("blur", function () {
      closeDescriptionEditor(true);
    });

    document.addEventListener("click", function (e) {
      if (!columnContextMenu.contains(e.target) && !cardContextMenu.contains(e.target)) {
        hideContextMenu();
      }
    });

    document.addEventListener("scroll", hideContextMenu, true);
    window.addEventListener("resize", hideContextMenu);
    window.addEventListener("blur", hideContextMenu);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") hideContextMenu();
    });

    async function init() {
      await requireLogin();
      await loadUsersFromApi();
      await loadBoardFromApi(false);
      await startRealtime();
    }

    init();
  </script>
