<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.0.26.04.2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
 <style>
    :root {
      --bg-main: #0f1117;
      --bg-panel: #151821;
      --bg-input: #0b0d13;
      --border: #252a36;
      --border-soft: #303747;
      --text-main: #e6e8ee;
      --text-muted: #8d93a3;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --danger-bg: rgba(237, 66, 69, 0.12);
      --danger-border: rgba(237, 66, 69, 0.35);
      --danger-text: #ffb4b6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .login-error {
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.82rem;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .form-label {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-control {
      height: 40px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 0.9rem;
      padding: 8px 10px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .form-control:hover {
      border-color: var(--border-soft);
    }

    .form-control:focus {
      background: var(--bg-input);
      color: var(--text-main);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.16);
    }

    .form-control::placeholder {
      color: #5f6675;
    }

    .btn-login {
      width: 100%;
      height: 40px;
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      border-radius: 10px;
      margin-top: 4px;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .btn-login:hover,
    .btn-login:focus {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #fff;
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .version {
      position: fixed;
      left: 14px;
      bottom: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #11141c;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      line-height: 1;
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input class="form-control" id="usuario" placeholder="" autocomplete="username"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input class="form-control" id="senha" type="password" placeholder="" autocomplete="current-password"/>
      </div>
      <button class="btn btn-login" type="submit" id="loginButton">Entrar</button>
    </form>
  </main>
  <script>
    const loginForm=document.getElementById("loginForm");
    const loginError=document.getElementById("loginError");
    const loginButton=document.getElementById("loginButton");
    async function checkAlreadyLogged(){
      try{const response=await fetch("/api/me"); if(response.ok) window.location.href="/dashboard.html";}catch(e){}
    }
    checkAlreadyLogged();
    function showError(message){loginError.textContent=message; loginError.style.display="block";}
    loginForm.addEventListener("submit",async function(e){
      e.preventDefault();
      loginError.style.display="none"; loginButton.disabled=true; loginButton.textContent="Entrando...";
      const usuario=document.getElementById("usuario").value.trim();
      const senha=document.getElementById("senha").value;
      try{
        const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario,senha})});
        const data=await response.json();
        if(!response.ok||!data.ok){showError(data.message||"Erro ao entrar.");return;}
        window.location.href="/dashboard.html";
      }catch(error){showError("Erro de conexão. Tente novamente.");}
      finally{loginButton.disabled=false; loginButton.textContent="Entrar";}
    });
  </script>
</body>
</html>
