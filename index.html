<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.0.26.04.2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<style>
  :root {
    --bg-main: #15131f;
    --bg-panel: #211d2e;
    --bg-panel-2: #2a243a;
    --bg-input: #171421;

    --border-color: #3c334f;
    --border-soft: rgba(255, 255, 255, 0.07);

    --text-main: #e8e2f5;
    --text-strong: #ffffff;
    --text-muted: #a99fbd;

    --primary: #8b5cf6;
    --primary-hover: #7c3aed;

    --fruit-pink: #fb7185;
    --fruit-blue: #38bdf8;
    --fruit-yellow: #facc15;

    --danger: #fb7185;
    --danger-soft: rgba(251, 113, 133, 0.15);

    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(168, 85, 247, 0.2), transparent 32%),
      radial-gradient(circle at bottom right, rgba(251, 113, 133, 0.13), transparent 34%),
      var(--bg-main);
    color: var(--text-main);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow: hidden;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: rgba(33, 29, 46, 0.92);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
  }

  .login-error {
    display: none;
    background: var(--danger-soft);
    border: 1px solid rgba(251, 113, 133, 0.28);
    color: #fecdd3;
    border-radius: var(--radius-md);
    padding: 10px 11px;
    font-size: 0.82rem;
    line-height: 1.35;
    margin-bottom: 14px;
  }

  .form-label {
    color: var(--text-main);
    font-size: 0.78rem;
    font-weight: 750;
    margin-bottom: 6px;
  }

  .form-control {
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: var(--radius-sm);
    font-size: 0.88rem;
    min-height: 40px;
    height: 40px;
    padding: 8px 10px;
  }

  .form-control:focus {
    background-color: var(--bg-input);
    color: var(--text-main);
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.22);
  }

  .form-control::placeholder {
    color: #756a8d;
  }

  .btn-login {
    width: 100%;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--fruit-pink));
    border: 0;
    color: #fff;
    font-weight: 850;
    font-size: 0.86rem;
    border-radius: var(--radius-sm);
    margin-top: 8px;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .btn-login:hover,
  .btn-login:focus {
    background: linear-gradient(135deg, var(--primary-hover), #e11d48);
    color: #fff;
    transform: translateY(-1px);
  }

  .btn-login:disabled {
    opacity: 0.72;
    cursor: not-allowed;
    transform: none;
  }

  .version {
    position: fixed;
    left: 16px;
    bottom: 12px;
    z-index: 40;
    font-size: 0.76rem;
    color: rgba(169, 159, 189, 0.88);
    background: rgba(23, 20, 33, 0.86);
    border: 1px solid rgba(168, 85, 247, 0.14);
    border-radius: 999px;
    padding: 5px 10px;
    line-height: 1;
    backdrop-filter: blur(10px);
    pointer-events: none;
  }

  .login-icon,
  .login-title,
  .login-subtitle {
    display: none;
  }

  @media (max-width: 480px) {
    body {
      padding: 14px;
    }

    .login-card {
      max-width: 100%;
      padding: 16px;
    }

    .version {
      left: 12px;
      bottom: 10px;
    }
  }
</style>
</head>
<body>
  <main class="login-card">
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input class="form-control" id="usuario" placeholder="" autocomplete="username"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input class="form-control" id="senha" type="password" placeholder="" autocomplete="current-password"/>
      </div>
      <button class="btn btn-login" type="submit" id="loginButton">Entrar</button>
    </form>
  </main>
  <script>
    const loginForm=document.getElementById("loginForm");
    const loginError=document.getElementById("loginError");
    const loginButton=document.getElementById("loginButton");
    async function checkAlreadyLogged(){
      try{const response=await fetch("/api/me"); if(response.ok) window.location.href="/dashboard.html";}catch(e){}
    }
    checkAlreadyLogged();
    function showError(message){loginError.textContent=message; loginError.style.display="block";}
    loginForm.addEventListener("submit",async function(e){
      e.preventDefault();
      loginError.style.display="none"; loginButton.disabled=true; loginButton.textContent="Entrando...";
      const usuario=document.getElementById("usuario").value.trim();
      const senha=document.getElementById("senha").value;
      try{
        const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario,senha})});
        const data=await response.json();
        if(!response.ok||!data.ok){showError(data.message||"Erro ao entrar.");return;}
        window.location.href="/dashboard.html";
      }catch(error){showError("Erro de conexão. Tente novamente.");}
      finally{loginButton.disabled=false; loginButton.textContent="Entrar";}
    });
  </script>
</body>
</html>
