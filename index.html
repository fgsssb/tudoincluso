<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.0.26.04.2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root{--border-color:#334155;--text-main:#e5e7eb;--text-muted:#94a3b8;--primary:#38bdf8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b 0,#0f172a 45%,#020617 100%);color:var(--text-main);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
    .login-card{width:100%;max-width:420px;background:rgba(17,24,39,.9);border:1px solid rgba(148,163,184,.18);border-radius:22px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
    .login-icon{width:52px;height:52px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;background:rgba(56,189,248,.13);color:#7dd3fc;border:1px solid rgba(56,189,248,.25);margin-bottom:18px;font-size:1.4rem}
    .login-title{font-size:1.35rem;font-weight:900;margin-bottom:4px}
    .login-subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:22px}
    .form-label{color:#e2e8f0;font-size:.9rem}
    .form-control{background-color:#020617;border:1px solid var(--border-color);color:var(--text-main);border-radius:12px;height:44px}
    .form-control:focus{background-color:#020617;color:var(--text-main);border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(56,189,248,.14)}
    .form-control::placeholder{color:#64748b}
    .btn-login{width:100%;height:46px;background:linear-gradient(135deg,#0ea5e9,#38bdf8);border:0;color:#020617;font-weight:900;border-radius:14px;margin-top:8px}
    .btn-login:hover{background:linear-gradient(135deg,#38bdf8,#7dd3fc);color:#020617}
    .login-error{display:none;background:rgba(127,29,29,.35);border:1px solid rgba(248,113,113,.35);color:#fecaca;border-radius:12px;padding:10px 12px;font-size:.86rem;margin-bottom:14px}
    .version{position:fixed;left:16px;bottom:12px;font-size:.82rem;color:rgba(148,163,184,.88);background:rgba(15,23,42,.86);border:1px solid rgba(148,163,184,.16);border-radius:999px;padding:6px 12px;backdrop-filter:blur(10px)}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input class="form-control" id="usuario" placeholder="" autocomplete="username"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input class="form-control" id="senha" type="password" placeholder="" autocomplete="current-password"/>
      </div>
      <button class="btn btn-login" type="submit" id="loginButton">Entrar</button>
    </form>
  </main>
  <script>
    const loginForm=document.getElementById("loginForm");
    const loginError=document.getElementById("loginError");
    const loginButton=document.getElementById("loginButton");
    async function checkAlreadyLogged(){
      try{const response=await fetch("/api/me"); if(response.ok) window.location.href="/dashboard.html";}catch(e){}
    }
    checkAlreadyLogged();
    function showError(message){loginError.textContent=message; loginError.style.display="block";}
    loginForm.addEventListener("submit",async function(e){
      e.preventDefault();
      loginError.style.display="none"; loginButton.disabled=true; loginButton.textContent="Entrando...";
      const usuario=document.getElementById("usuario").value.trim();
      const senha=document.getElementById("senha").value;
      try{
        const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario,senha})});
        const data=await response.json();
        if(!response.ok||!data.ok){showError(data.message||"Erro ao entrar.");return;}
        window.location.href="/dashboard.html";
      }catch(error){showError("Erro de conexão. Tente novamente.");}
      finally{loginButton.disabled=false; loginButton.textContent="Entrar";}
    });
  </script>
</body>
</html>
