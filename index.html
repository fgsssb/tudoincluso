<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TI Interno - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="login-shell">
    <section class="login-card glass">
      <div class="badge-soft mb-3">Sistema interno</div>
      <h1 class="h3 fw-bold mb-2">Entrar no painel</h1>
      <p class="text-secondary mb-4">Use um dos usuários cadastrados na tabela <code>ti_users</code>.</p>
      <form id="loginForm" class="vstack gap-3">
        <div>
          <label class="form-label">Login</label>
          <input class="form-control form-control-lg" id="login" placeholder="jean" autocomplete="username" required>
        </div>
        <div>
          <label class="form-label">Senha</label>
          <input class="form-control form-control-lg" id="senha" type="password" placeholder="123456" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
      </form>
      <div id="loginMsg" class="mini-msg mt-3 d-none"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
