<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <title>NNcek4x8lzToZwE3p2Upw7kWdcG5J1Dacq45odaYj9htiPDx8s</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <section class="topbar">
      <div class="user-menu" id="userMenu">
        <button class="user" id="loggedUser" type="button" title="Usuário logado" aria-label="Abrir menu do usuário" aria-expanded="false">
          <span class="user-avatar" id="userAvatar">J<span class="dot"></span></span>
          <span class="user-info">
            <span class="user-label">Logado como</span>
            <span class="user-name" id="userName">...</span>
          </span>
          <span class="user-arrow" aria-hidden="true"></span>
        </button>

        <div class="user-dropdown" id="userDropdown">
          <button class="logout-btn" id="logoutBtn" type="button">Sair</button>
        </div>
      </div>
      <div class="search-actions">
        <div class="search-box" id="searchBox">
          <select id="searchFilter" title="Filtro de pesquisa" aria-label="Filtro de pesquisa">
            <option value="titulo">Título</option>
            <option value="solicitante">Solicitante</option>
            <option value="status">Status</option>
            <option value="data">Data</option>
          </select>
          <input id="searchInput" type="search" placeholder="Pesquisar..." maxlength="80" autocomplete="off" spellcheck="false" aria-label="Campo de pesquisa">
        </div>
        <button class="search-btn" id="searchBtn" type="button" title="Pesquisar chamados" aria-label="Pesquisar chamados"></button>
        <button class="status-manager-btn" id="statusManagerBtn" type="button" title="Gerenciar status" aria-label="Gerenciar status"></button>
        <button class="add-btn" id="addTicketBtn" type="button" title="Adicionar chamado" aria-label="Adicionar chamado"></button>
      </div>
    </section>
    <section class="panel">
      <div id="doneCards" class="cards"></div>
    </section>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Adicionar chamado</h2>
      <div class="form-grid">
        <input id="newTitle" type="text" placeholder="Título" maxlength="90" autocomplete="off" spellcheck="false">
        <textarea id="newDesc" placeholder="Descrição" maxlength="800" autocomplete="off" spellcheck="false"></textarea>
        <input id="newPerson" type="text" placeholder="Solicitado por" maxlength="60" autocomplete="off" spellcheck="false">
        <select id="newStatus">
          <option value="concluido">Concluído</option>
          <option value="andamento">Em andamento</option>
          <option value="pendente">Pendente - Conferir descrição</option>
          <option value="suporte">Aguardando suporte</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="cancelAddBtn" type="button">Cancelar</button>
        <button id="saveAddBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="detailBackdrop" class="modal-backdrop">
    <div class="modal" id="detailModal"><div id="detailContent" class="detail-grid"></div></div>
  </div>

  <div id="contextMenu" class="context-menu">
    <button class="context-item danger" id="deleteMenuBtn" type="button">Excluir chamado</button>
    <button class="context-item edit" id="editTitleMenuBtn" type="button">Editar título</button>
    <button class="context-item edit" id="editRequesterMenuBtn" type="button">Editar solicitante</button>
    <button class="context-item edit" id="editDescriptionMenuBtn" type="button">Editar descrição</button>
    <button class="context-item edit" id="editDateMenuBtn" type="button">Editar data</button>
    <button class="context-item status-action" id="changeStatusBtn" type="button">Mudar status</button>
  </div>

  <div id="editTitleBackdrop" class="modal-backdrop"><div class="modal"><h2>Editar título</h2><div class="form-grid"><input id="editTitleInput" type="text" placeholder="Novo título" maxlength="90" autocomplete="off" spellcheck="false"></div><div class="modal-actions"><button class="secondary" id="cancelEditTitleBtn" type="button">Cancelar</button><button id="saveEditTitleBtn" type="button">Salvar</button></div></div></div>
  <div id="editRequesterBackdrop" class="modal-backdrop"><div class="modal"><h2>Editar solicitante</h2><div class="form-grid"><input id="editRequesterInput" type="text" placeholder="Novo solicitante" maxlength="60" autocomplete="off" spellcheck="false"></div><div class="modal-actions"><button class="secondary" id="cancelEditRequesterBtn" type="button">Cancelar</button><button id="saveEditRequesterBtn" type="button">Salvar</button></div></div></div>
  <div id="editDescriptionBackdrop" class="modal-backdrop"><div class="modal"><h2>Editar descrição</h2><div class="form-grid"><textarea id="editDescriptionInput" placeholder="Nova descrição" maxlength="800" autocomplete="off" spellcheck="false"></textarea></div><div class="modal-actions"><button class="secondary" id="cancelEditDescriptionBtn" type="button">Cancelar</button><button id="saveEditDescriptionBtn" type="button">Salvar</button></div></div></div>
  <div id="editDateBackdrop" class="modal-backdrop"><div class="modal"><h2>Editar data</h2><div class="form-grid"><input id="editDateInput" type="date" autocomplete="off" spellcheck="false"></div><div class="modal-actions"><button class="secondary" id="cancelEditDateBtn" type="button">Cancelar</button><button id="saveEditDateBtn" type="button">Salvar</button></div></div></div>
  <div id="deleteConfirmBackdrop" class="modal-backdrop"><div class="modal"><h2>Excluir chamado</h2><p class="confirm-text">Tem certeza que deseja excluir esse chamado?</p><div class="modal-actions"><button class="secondary" id="cancelDeleteBtn" type="button">Cancelar</button><button class="danger-btn" id="confirmDeleteBtn" type="button">Excluir</button></div></div></div>
  </div>

  <div id="statusChangeBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Mudar status</h2>
      <div class="form-grid">
        <select id="statusChangeSelect">
          <option value="andamento">Em andamento</option>
          <option value="suporte">Aguardando suporte</option>
          <option value="concluido">Concluído</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="cancelStatusChangeBtn" type="button">Cancelar</button>
        <button id="saveStatusChangeBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="statusManagerBackdrop" class="modal-backdrop">
    <div class="modal status-manager-modal">
      <h2>Status</h2>
      <div class="status-manager-options">
        <button class="status-manager-card" id="listStatusesBtn" type="button">
          <span class="status-manager-icon list"></span>
          <span class="status-manager-info">
            <strong>Listar status</strong>
            <small>Ver todos os status disponíveis no sistema.</small>
          </span>
        </button>
        <button class="status-manager-card" id="manageStatusesBtn" type="button">
          <span class="status-manager-icon manage"></span>
          <span class="status-manager-info">
            <strong>Adicionar/remover status</strong>
            <small>Criar status com cor própria ou remover status customizados.</small>
          </span>
        </button>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="cancelStatusManagerBtn" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="statusListBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Listar status</h2>
      <div class="status-list" id="statusList"></div>
      <div class="modal-actions">
        <button class="secondary" id="closeStatusListBtn" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <div id="statusManageBackdrop" class="modal-backdrop">
    <div class="modal status-manage-modal">
      <h2>Adicionar/remover status</h2>
      <div class="form-grid">
        <input id="newStatusName" type="text" placeholder="Nome do status" maxlength="50" autocomplete="off" spellcheck="false">
        <div class="status-color-row">
          <label for="newStatusColor">Cor</label>
          <input id="newStatusColor" type="color" value="#8c96a8">
          <span id="newStatusColorText">#8c96a8</span>
        </div>
        <button id="saveNewStatusBtn" type="button">Adicionar status</button>
      </div>
      <div class="status-remove-area">
        <span class="status-remove-title">Status existentes</span>
        <div class="status-remove-list" id="statusRemoveList"></div>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="closeStatusManageBtn" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <div id="statusDeleteConfirmBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Remover status</h2>
      <p class="confirm-text" id="statusDeleteConfirmText">Tem certeza que deseja remover esse status?</p>
      <div class="modal-actions">
        <button class="secondary" id="cancelStatusDeleteBtn" type="button">Cancelar</button>
        <button class="danger-btn" id="confirmStatusDeleteBtn" type="button">Remover</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
