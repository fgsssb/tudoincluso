<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <title>NNcek4x8lzToZwE3p2Upw7kWdcG5J1Dacq45odaYj9htiPDx8s</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <section class="topbar">
      <div class="user" id="loggedUser" title="Usuário logado">
        <span class="user-avatar" id="userAvatar">J<span class="dot"></span></span>
        <span class="user-info">
          <span class="user-label">Logado como</span>
          <span class="user-name" id="userName">Jean</span>
        </span>
      </div>

      <button class="add-btn" id="addTicketBtn" type="button" title="Adicionar chamado" aria-label="Adicionar chamado"></button>
    </section>

    <section class="panel">
      <div id="doneCards" class="cards"></div>
    </section>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Adicionar chamado</h2>

      <div class="form-grid">
        <input id="newTitle" type="text" placeholder="Título" maxlength="90" autocomplete="off" spellcheck="false">
        <textarea id="newDesc" placeholder="Descrição" maxlength="800" autocomplete="off" spellcheck="false"></textarea>
        <input id="newPerson" type="text" placeholder="Solicitado por" maxlength="60" autocomplete="off" spellcheck="false">

        <select id="newStatus">
          <option value="concluido">Concluído</option>
          <option value="andamento">Em andamento</option>
          <option value="suporte">Aguardando suporte</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancelAddBtn" type="button">Cancelar</button>
        <button id="saveAddBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="detailBackdrop" class="modal-backdrop">
    <div class="modal" id="detailModal">
      <div id="detailContent" class="detail-grid"></div>
    </div>
  </div>

  <div id="contextMenu" class="context-menu">
    <button class="context-item danger" id="deleteMenuBtn" type="button">Excluir chamado</button>
    <button class="context-item edit" id="editTitleMenuBtn" type="button">Editar título</button>
    <button class="context-item edit" id="editRequesterMenuBtn" type="button">Editar solicitante</button>
    <button class="context-item edit" id="editDescriptionMenuBtn" type="button">Editar descrição</button>
    <button class="context-item support-action" id="moveSupportBtn" type="button">Mudar status para suporte</button>
  </div>

  <div id="editTitleBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Editar título</h2>

      <div class="form-grid">
        <input id="editTitleInput" type="text" placeholder="Novo título" maxlength="90" autocomplete="off" spellcheck="false">
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancelEditTitleBtn" type="button">Cancelar</button>
        <button id="saveEditTitleBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="editRequesterBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Editar solicitante</h2>

      <div class="form-grid">
        <input id="editRequesterInput" type="text" placeholder="Novo solicitante" maxlength="60" autocomplete="off" spellcheck="false">
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancelEditRequesterBtn" type="button">Cancelar</button>
        <button id="saveEditRequesterBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="editDescriptionBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Editar descrição</h2>

      <div class="form-grid">
        <textarea id="editDescriptionInput" placeholder="Nova descrição" maxlength="800" autocomplete="off" spellcheck="false"></textarea>
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancelEditDescriptionBtn" type="button">Cancelar</button>
        <button id="saveEditDescriptionBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="deleteConfirmBackdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Excluir chamado</h2>
      <p class="confirm-text">Tem certeza que deseja excluir esse chamado?</p>

      <div class="modal-actions">
        <button class="secondary" id="cancelDeleteBtn" type="button">Cancelar</button>
        <button class="danger-btn" id="confirmDeleteBtn" type="button">Excluir</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
